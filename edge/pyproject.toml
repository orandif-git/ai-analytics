[project]
name = "aia-edge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "numpy>=1.26", "opencv-python-headless>=4.9"]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3"]
dev = ["pytest>=8"]

[project.scripts]
aia-edge = "aia_edge.cli:main"

[tool.setuptools.packages.find]
include = ["aia_edge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
